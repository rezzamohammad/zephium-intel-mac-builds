name: Build Intel DMG (strict + release)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag, e.g. zephium-1.0.5-intel1; blank means artifact only'
        required: false
        type: string
      upstream_ref:
        description: 'Zephium source ref; blank uses ZEPHIUM_SOURCE_REF or the pinned v1.0.5 commit'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: intel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      ZEPHIUM_SOURCE_REPOSITORY: ${{ vars.ZEPHIUM_SOURCE_REPOSITORY || 'zephium-browser/Zephium' }}
      ZEPHIUM_SOURCE_REF: ${{ inputs.upstream_ref || vars.ZEPHIUM_SOURCE_REF || '1c4846cec9a9a0ab40ed45113d69a3f3c244d279' }}
      RUST_TARGET: x86_64-apple-darwin
      CARGO_TARGET_X86_64_APPLE_DARWIN_RUNNER: env
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ZEPHIUM_SOURCE_REPOSITORY }}
          ref: ${{ env.ZEPHIUM_SOURCE_REF }}
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.ZEPHIUM_SOURCE_TOKEN || github.token }}
      - name: Checkout build automation
        uses: actions/checkout@v4
        with:
          path: build-automation
          persist-credentials: false
      - name: Verify native Intel runner and source contract
        id: pins
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == x86_64 ]]
          sw_vers
          xcodebuild -version
          python3 build-automation/scripts/intel/prepare-source.py . | tee intel-pins.txt
          cat intel-pins.txt >> "$GITHUB_OUTPUT"
          git diff --check
      - name: Test DMG packaging before compiling the browser
        run: build-automation/scripts/intel/test-packaging.sh
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.pins.outputs.rust }}
          targets: x86_64-apple-darwin
      - name: Verify toolchain pins and architecture
        env:
          RUST_PIN: ${{ steps.pins.outputs.rust }}
          NODE_PIN: ${{ steps.pins.outputs.node }}
          PNPM_PIN: ${{ steps.pins.outputs.pnpm }}
        run: |
          set -euo pipefail
          rustc -vV | tee rustc-version.txt
          grep -qx 'host: x86_64-apple-darwin' rustc-version.txt
          grep -qx "release: $RUST_PIN" rustc-version.txt
          [[ "$(node -p 'process.arch')" == x64 ]]
          [[ "$(node --version)" == "v$NODE_PIN" ]]
          [[ "pnpm@$(pnpm --version)" == "$PNPM_PIN" ]]
      - run: pnpm install --frozen-lockfile
      - name: Preflight release tag
        if: ${{ inputs.release_tag != '' }}
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^zephium-[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?-intel[0-9]+$ ]]
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "error: release tag already exists: $TAG" >&2
            exit 1
          fi
      - name: Check upstream runtime policy and native macOS policy tests
        run: |
          set -euo pipefail
          cargo xtask check-engine-floors
          cargo xtask check-advisory-exceptions
          cargo test -p zephium-core --lib --locked --target "$RUST_TARGET" macos::tests
      - name: Require upstream release security gate before publication
        if: ${{ inputs.release_tag != '' }}
        run: cargo xtask check-release-engine-security
      - name: Build and pack Zephium
        run: |
          set -euo pipefail
          build-automation/scripts/package "$RUST_TARGET" 2>&1 | tee build.log
      - name: Verify app bundle, architecture and DMG
        run: build-automation/scripts/intel/verify-build.sh
      - name: Collect diagnostic excerpts
        if: ${{ always() }}
        run: |
          set -euo pipefail
          {
            echo 'Targeted excerpts from this Intel macOS build:'
            echo 'Linker, deployment-target and deprecation warnings:'
            if [[ -f build.log ]]; then
              grep -E 'ld: warning|built for newer macOS|is deprecated|warning:|error:' build.log | head -80 || true
            else
              echo 'Build did not start; see the failed preflight or policy step in Actions.'
            fi
          } > diagnostic-excerpts.txt
          mkdir -p dist
          for diagnostic in SHA256SUMS build-manifest.txt runtime-diagnostics.txt diagnostic-excerpts.txt build.log dmg-file.txt intel-pins.txt codesign.txt entitlements.plist; do
            if [[ -f "$diagnostic" ]]; then cp "$diagnostic" dist/; fi
          done
      - name: Upload DMG and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Zephium-Intel-macOS-strict-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub release when requested
        if: ${{ success() && inputs.release_tag != '' }}
        env:
          TAG: ${{ inputs.release_tag }}
          VERSION: ${{ steps.pins.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$TAG" == "zephium-$VERSION-intel"* ]]
          gh release create "$TAG" dist/Zephium-macOS-x86_64.dmg dist/community-build.patch dist/THIRD_PARTY_NOTICES.txt dist/COMMUNITY-BUILD.txt SHA256SUMS build-manifest.txt runtime-diagnostics.txt diagnostic-excerpts.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes "Intel x86_64 Zephium $VERSION build of $ZEPHIUM_SOURCE_REPOSITORY@$ZEPHIUM_SOURCE_REF from $GITHUB_SHA. Ad hoc signed community build, not notarized. Manual updates only. See build-manifest.txt, community-build.patch and SHA256SUMS."
